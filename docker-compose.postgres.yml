# Self-host OMA — single-instance + Postgres backend.
#
# Same shape as docker-compose.yml but with a postgres service in
# place of the SQLite file. better-auth's tables now live in the same
# Postgres database as everything else (kysely-adapter PostgresDialect
# wrapping a node-postgres Pool); AUTH_DATABASE_PATH is ignored in PG
# mode.
#
# Quick start:
#   1. Copy .env.example → .env (fill ANTHROPIC_API_KEY)
#   2. docker compose -f docker-compose.postgres.yml up --build
#   3. curl localhost:8787/health
#
# When to use this over the SQLite compose:
#   - Multiple oma-server instances behind a load balancer (sqlite is
#     single-writer; PG handles concurrent writes natively).
#   - You already operate a PG cluster and want one less DB engine.
#   - Larger sessions tables (PG handles 100M+ row indices better).

services:
  oma-server:
    build:
      context: .
      dockerfile: apps/main-node/Dockerfile
      args:
        SKIP_CONSOLE: "1"
    image: openma/main-node:dev
    container_name: oma-server
    ports:
      - "${OMA_PORT:-8787}:8787"
      - "5173:8787"
    env_file:
      - path: ./.env
        required: false
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Optional Anthropic-compat proxy settings belong in .env
      # (ANTHROPIC_BASE_URL / ANTHROPIC_CUSTOM_HEADERS). Do NOT default
      # them to "" here — @ai-sdk/anthropic validates baseURL on
      # module init and rejects empty string.
      # Main store: postgres. main-node detects postgres:// scheme on
      # DATABASE_URL and routes every store package through the PG adapter.
      DATABASE_URL: postgres://oma:oma@postgres:5432/oma
      # AUTH_DATABASE_PATH is ignored in PG mode — better-auth's tables
      # live in the same PG database as the main store.
      SANDBOX_WORKDIR: /app/data/sandboxes
      MEMORY_BLOB_DIR: /app/data/memory-blobs
      SESSION_OUTPUTS_DIR: /app/data/session-outputs
      OMA_VAULT_PROXY_URL: http://oma-vault:14322
      OMA_VAULT_CA_CERT: /app/data/oma-vault-ca/ca.crt
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://117.72.219.106:8787}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-0}
      # Set AUTH_DISABLE_SIGN_UP=1 in .env after registering the initial admin account
      AUTH_DISABLE_SIGN_UP: ${AUTH_DISABLE_SIGN_UP:-0}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://117.72.219.106:8787}
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      oma-vault:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    container_name: oma-postgres
    environment:
      POSTGRES_USER: oma
      POSTGRES_PASSWORD: oma
      POSTGRES_DB: oma
    volumes:
      - oma-pgdata:/var/lib/postgresql/data
    # No host port published — only oma-server reaches it on the internal
    # bridge network. Add `ports: ["5432:5432"]` if you want psql access
    # from the host.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oma -d oma"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  # Same outbound credential injector as the SQLite compose. The vault
  # data ends up in PG (oma-vault and oma-server share the same store
  # via the SqlVaultRepo abstraction), but oma-vault still reads from
  # its own DATABASE_URL — point it at the same postgres.
  #
  # Multi-replica: oma-vault is stateless. To run N copies behind a
  # service / load balancer, uncomment `deploy.replicas: 3` below; all
  # replicas share the same CA via the `./data/oma-vault-ca` volume,
  # using an O_EXCL `ca.lock` so only the first replica generates the
  # cert. Sandboxes point HTTPS_PROXY at the LB DNS (or one host:port).
  oma-vault:
    build:
      context: .
      dockerfile: apps/oma-vault/Dockerfile
    image: openma/oma-vault:dev
    container_name: oma-vault
    environment:
      DATABASE_URL: postgres://oma:oma@postgres:5432/oma
      OMA_VAULT_CA_DIR: /app/data/oma-vault-ca
      OMA_VAULT_PORT: "14322"
      OMA_TENANT: ${OMA_TENANT:-*}
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    # deploy:
    #   replicas: 3   # uncomment + put a Service / LB in front to fan-out

  oma-cmdb-mcp:
    build:
      context: .
      dockerfile: apps/cmdb-mcp/Dockerfile
    image: openma/cmdb-mcp:dev
    container_name: oma-cmdb-mcp
    environment:
      PORT: "3910"
      CMDB_BASE_URL: ${CMDB_BASE_URL:-https://10.0.21.209}
      # Choose either: admin credentials, static token, or Vault proxy mode
      CMDB_USERNAME: ${CMDB_USERNAME:-}
      CMDB_PASSWORD: ${CMDB_PASSWORD:-}
      CMDB_API_TOKEN: ${CMDB_API_TOKEN:-}
      CMDB_AUTH_HEADER: ${CMDB_AUTH_HEADER:-Authorization}
      CMDB_AUTH_SCHEME: ${CMDB_AUTH_SCHEME:-Bearer}
      CMDB_MCP_INGRESS_TOKEN: ${CMDB_MCP_INGRESS_TOKEN:-}
      CMDB_DB_URL: ${CMDB_DB_URL:-}
      CMDB_DB_TYPE: ${CMDB_DB_TYPE:-auto}
      CMDB_SQL_MAX_ROWS: ${CMDB_SQL_MAX_ROWS:-200}
      CMDB_SQL_TIMEOUT_MS: ${CMDB_SQL_TIMEOUT_MS:-10000}
      HTTPS_PROXY: http://oma-vault:14322
      HTTP_PROXY: http://oma-vault:14322
      # Internal IP TLS / self-signed certificate SAN compatibility
      NODE_TLS_REJECT_UNAUTHORIZED: ${NODE_TLS_REJECT_UNAUTHORIZED:-0}
      LOG_LEVEL: ${CMDB_MCP_LOG_LEVEL:-info}
    volumes:
      - ./secrets/cmdb-ca.crt:/app/certs/cmdb-ca.crt:ro
      - ./data:/app/data:ro
    depends_on:
      oma-vault:
        condition: service_started
    ports:
      - "${CMDB_MCP_BIND_HOST:-127.0.0.1}:3910:3910"
    mem_limit: 256m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3910/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Feishu KB MCP sidecar — official lark-openapi-mcp (app identity,
  # tenant_access_token) exposing a 4-tool read-only whitelist
  # (mcp__feishu-kb__wiki_v2_space_list, wiki_v2_spaceNode_list, wiki_v2_space_getNode, docx_v1_document_rawContent) over
  # Streamable HTTP at http://oma-lark-mcp:3000/mcp. The -t whitelist lives
  # in the Dockerfile CMD (git-auditable); OMA's harness registers every
  # tool a server returns, so the process-level whitelist is the only
  # write-isolation boundary. Credentials come from the lark-mcp-config
  # docker secret — cp docker/lark-mcp/config.example.json
  # secrets/lark-mcp-config.json and fill in. No host port: internal bridge
  # network only; cross-host deploys need ingress auth first
  # (docs/integrations/feishu-kb-p0-sds.md §6).
  oma-lark-mcp:
    build:
      context: ./docker/lark-mcp
    image: openma/lark-mcp:dev
    container_name: oma-lark-mcp
    environment:
      - NODE_OPTIONS=--max-old-space-size=512
    secrets:
      - lark-mcp-config
    mem_limit: 768m
    restart: unless-stopped

volumes:
  oma-pgdata:

secrets:
  # Feishu KB MCP credential config (appId/appSecret JSON). secrets/ is
  # gitignored — the example lives at docker/lark-mcp/config.example.json.
  lark-mcp-config:
    file: ./secrets/lark-mcp-config.json
